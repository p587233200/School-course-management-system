  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: laravel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Adminer (DB 管理工具)
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

networks:
  laravel:

volumes:
  pgdata:
